name: Build and Release APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Create GitHub release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"Roleplay Hub Android ${{ github.ref_name }}\",\"draft\":false}")
          echo "$RELEASE" | jq .
          UPLOAD_URL=$(echo "$RELEASE" | jq -r .upload_url | sed 's/{?name,label}//')
          for apk in android-app/app/build/outputs/apk/release/RoleplayHub-*.apk; do
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              "$UPLOAD_URL?name=$(basename "$apk")"
          done
