name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"Roleplay Hub Android $TAG\",\"draft\":true}")
          echo "$RELEASE_JSON" | jq .
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r .id)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create draft release"
            exit 1
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Upload APK to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RELEASE_ID="${{ env.RELEASE_ID }}"
          API="https://api.github.com/repos/${{ github.repository }}"

          UPLOAD_URL=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "$API/releases/$RELEASE_ID" | jq -r .upload_url | sed 's/{?name,label}//')

          for apk in android-app/app/build/outputs/apk/release/RoleplayHub-*.apk; do
            NAME=$(basename "$apk")
            echo "Uploading $NAME"
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              "$UPLOAD_URL?name=$NAME"
          done

          echo "Publishing release $RELEASE_ID"
          PUBLISH_JSON=$(curl -s -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "$API/releases/$RELEASE_ID" \
            -d '{"draft":false}')
          echo "$PUBLISH_JSON" | jq .
          PUBLISHED_DRAFT=$(echo "$PUBLISH_JSON" | jq -r .draft)
          if [ "$PUBLISHED_DRAFT" != "false" ]; then
            echo "Release is still draft after publish attempt"
            exit 1
          fi
