name: Build and Release APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Create or update release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"

          # Look for an existing release by tag (draft releases are not visible via /releases/tags/)
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "$API/releases" | jq -r ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            echo "Found existing release $EXISTING for $TAG"
            RELEASE_ID="$EXISTING"
          else
            echo "Creating draft release for $TAG"
            RELEASE=$(curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"Roleplay Hub Android $TAG\",\"draft\":true}")
            echo "$RELEASE" | jq .
            RELEASE_ID=$(echo "$RELEASE" | jq -r .id)
          fi

          UPLOAD_URL=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "$API/releases/$RELEASE_ID" | jq -r .upload_url | sed 's/{?name,label}//')

          for apk in android-app/app/build/outputs/apk/release/RoleplayHub-*.apk; do
            NAME=$(basename "$apk")
            echo "Uploading $NAME"
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              "$UPLOAD_URL?name=$NAME"
          done

          echo "Publishing release $RELEASE_ID"
          curl -s -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "$API/releases/$RELEASE_ID" \
            -d '{"draft":false}' | jq .
