name: Build and Release APK

on:
  release:
    types: [created]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Upload APK to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID="${{ github.event.release.id }}"
          API="https://api.github.com/repos/${{ github.repository }}"

          UPLOAD_URL=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "$API/releases/$RELEASE_ID" | jq -r .upload_url | sed 's/{?name,label}//')

          for apk in android-app/app/build/outputs/apk/release/RoleplayHub-*.apk; do
            NAME=$(basename "$apk")
            echo "Uploading $NAME"
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              "$UPLOAD_URL?name=$NAME"
          done

          echo "Publishing release $RELEASE_ID"
          curl -s -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "$API/releases/$RELEASE_ID" \
            -d '{"draft":false}' | jq .
